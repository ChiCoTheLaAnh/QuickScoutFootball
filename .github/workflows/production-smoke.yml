name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production or preview URL to smoke-test
        required: true
        type: string
      check_supabase_runs:
        description: Check Supabase recommendation-run persistence
        required: true
        default: false
        type: boolean
      check_cron_health:
        description: Check authenticated cron health endpoint
        required: true
        default: true
        type: boolean
      expect_healthy_cron:
        description: Fail if cron health reports attention needed
        required: true
        default: false
        type: boolean
      run_e2e:
        description: Run the exact-identity browser flow against this deployment
        required: true
        default: true
        type: boolean
      search_query:
        description: Search text used to discover the exact target
        required: true
        default: salah
        type: string
      target_name:
        description: Exact target display name
        required: true
        default: Mohamed Salah
        type: string
      target_provider_source:
        description: Exact target provider source
        required: true
        default: apiFootball
        type: string
      target_provider_player_id:
        description: Exact target provider player ID
        required: true
        default: '306'
        type: string

env:
  CI: true

jobs:
  smoke:
    name: Post-deploy smoke
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ inputs.base_url }}
      SMOKE_SUPABASE: ${{ inputs.check_supabase_runs && '1' || '0' }}
      SMOKE_CRON_HEALTH: ${{ inputs.check_cron_health && '1' || '0' }}
      SMOKE_CRON_HEALTH_EXPECT_HEALTHY: ${{ inputs.expect_healthy_cron && '1' || '0' }}
      SMOKE_SEARCH_QUERY: ${{ inputs.search_query }}
      SMOKE_TARGET_NAME: ${{ inputs.target_name }}
      SMOKE_TARGET_PROVIDER_SOURCE: ${{ inputs.target_provider_source }}
      SMOKE_TARGET_PROVIDER_PLAYER_ID: ${{ inputs.target_provider_player_id }}
      E2E_SEARCH_QUERY: ${{ inputs.search_query }}
      E2E_TARGET_NAME: ${{ inputs.target_name }}
      E2E_TARGET_PROVIDER_SOURCE: ${{ inputs.target_provider_source }}
      E2E_TARGET_PROVIDER_PLAYER_ID: ${{ inputs.target_provider_player_id }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke checks
        run: node scripts/smoke-test.mjs

      - name: Install Playwright browser
        if: ${{ inputs.run_e2e }}
        run: npx playwright install --with-deps chromium

      - name: Run production E2E
        if: ${{ inputs.run_e2e }}
        run: npm run test:e2e
