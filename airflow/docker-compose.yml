name: quickscout-airflow

x-airflow-common: &airflow-common
  image: quickscout-airflow:3.3.1
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-metadata-db/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: quickscout_local_jwt_secret
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    DBT_HOST: quickscout-db
    DBT_PORT: "5432"
    DBT_USER: quickscout
    DBT_PASSWORD: quickscout
    DBT_DBNAME: quickscout
    DBT_THREADS: "4"
    DBT_SSLMODE: disable
    QUICKSCOUT_ROOT: /opt/airflow/quickscout
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./logs:/opt/airflow/logs
    - ../:/opt/airflow/quickscout:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-metadata-db:
      condition: service_healthy
    quickscout-db:
      condition: service_healthy

services:
  airflow-metadata-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - airflow-metadata-db:/var/lib/postgresql/data

  quickscout-db:
    image: postgres:16
    environment:
      POSTGRES_USER: quickscout
      POSTGRES_PASSWORD: quickscout
      POSTGRES_DB: quickscout
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "quickscout", "-d", "quickscout"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - quickscout-db:/var/lib/postgresql/data
      - ./postgres-init/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - ../supabase/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../supabase/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  airflow-init:
    <<: *airflow-common
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    depends_on:
      airflow-metadata-db:
        condition: service_healthy
      quickscout-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    depends_on:
      airflow-metadata-db:
        condition: service_healthy
      quickscout-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    depends_on:
      airflow-metadata-db:
        condition: service_healthy
      quickscout-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\""]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    depends_on:
      airflow-metadata-db:
        condition: service_healthy
      quickscout-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-metadata-db:
  quickscout-db:
